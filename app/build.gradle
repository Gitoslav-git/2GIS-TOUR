plugins { id 'com.android.application' }

def backendUrl = providers.environmentVariable('BACKEND_BASE_URL').orElse('https://example.invalid').get()
if (!backendUrl.startsWith('https://')) {
    throw new GradleException('BACKEND_BASE_URL must be HTTPS')
}
def debugBackendUrl = providers.environmentVariable('DEBUG_BACKEND_BASE_URL').orElse(backendUrl).get()
def dgisSdkVersion = providers.environmentVariable('DGIS_SDK_VERSION').orElse('13.6.0').get()
if (!debugBackendUrl.startsWith('https://') && !debugBackendUrl.startsWith('http://')) {
    throw new GradleException('DEBUG_BACKEND_BASE_URL must start with http:// or https://')
}
android {
    namespace 'ru.gulyay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.gulyay.app'
        minSdk 23
        targetSdk 35
        versionCode 24
        versionName '0.6.9.c'
        buildConfigField 'String', 'BACKEND_BASE_URL', '"' + backendUrl.replace('"', '\\"') + '"'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BACKEND_BASE_URL', '"' + debugBackendUrl.replace('"', '\\"') + '"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "ru.dgis.sdk:sdk-map:${dgisSdkVersion}"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
}
