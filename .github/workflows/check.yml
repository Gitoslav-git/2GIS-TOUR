name: Verify and build APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install server and tests
        run: python -m pip install -e './backend[test]'
      - name: Verify shared version source
        run: python scripts/check_version.py
      - name: Test server
        run: python -m pytest backend/tests -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Add mobile SDK key when configured
        env:
          DGIS_SDK_KEY_BASE64: ${{ secrets.DGIS_SDK_KEY_BASE64 }}
        run: |
          if [ -n "$DGIS_SDK_KEY_BASE64" ]; then
            mkdir -p app/src/main/assets
            printf '%s' "$DGIS_SDK_KEY_BASE64" | base64 --decode > app/src/main/assets/dgissdk.key
          fi
      - name: Validate backend URL
        env:
          BACKEND_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://symmetrical-guacamole-vprvqxw4rv4p267j-8000.app.github.dev/' || vars.BACKEND_BASE_URL }}
        run: |
          if [ -z "$BACKEND_BASE_URL" ]; then
            echo "::error::Repository variable BACKEND_BASE_URL is not configured"
            exit 1
          fi
          case "$BACKEND_BASE_URL" in
            https://*) ;;
            *) echo "::error::BACKEND_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          echo "::notice title=Backend target::$BACKEND_BASE_URL"
      - name: Build debug APK
        env:
          BACKEND_BASE_URL: ${{ github.ref == 'refs/heads/develop' && 'https://symmetrical-guacamole-vprvqxw4rv4p267j-8000.app.github.dev/' || vars.BACKEND_BASE_URL }}
          DGIS_SDK_VERSION: ${{ vars.DGIS_SDK_VERSION || '13.6.0' }}
          ROUTE_GROUPS_ENABLED: 'true'
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gulyay-${{ github.ref_name }}-${{ github.run_id }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
