plugins { id 'com.android.application' }

def backendUrl = providers.environmentVariable('BACKEND_BASE_URL')
        .orElse('https://example.invalid').get()
if (!backendUrl.startsWith('https://')) {
    throw new GradleException('BACKEND_BASE_URL must be HTTPS')
}
def emulatorBackendUrl = providers.environmentVariable('EMULATOR_BACKEND_BASE_URL')
        .orElse('http://10.0.2.2:8000').get()
def deviceBackendUrl = providers.environmentVariable('DEVICE_BACKEND_BASE_URL')
        .orElse('http://192.168.0.123:8000').get()
def dgisSdkVersion = providers.environmentVariable('DGIS_SDK_VERSION').orElse('13.6.0').get()
def validateDebugUrl = { String name, String value ->
    if (!value.startsWith('https://') && !value.startsWith('http://')) {
        throw new GradleException("${name} must start with http:// or https://")
    }
}
validateDebugUrl('EMULATOR_BACKEND_BASE_URL', emulatorBackendUrl)
validateDebugUrl('DEVICE_BACKEND_BASE_URL', deviceBackendUrl)
android {
    namespace 'ru.gulyay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.gulyay.app'
        minSdk 23
        targetSdk 35
        versionCode 25
        versionName '0.6.9.d'
        buildConfigField 'String', 'BACKEND_BASE_URL', '"' + backendUrl.replace('"', '\\"') + '"'
        buildConfigField 'String', 'EMULATOR_BACKEND_BASE_URL', '"https://example.invalid"'
        buildConfigField 'String', 'DEVICE_BACKEND_BASE_URL', '"https://example.invalid"'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'EMULATOR_BACKEND_BASE_URL',
                    '"' + emulatorBackendUrl.replace('"', '\\"') + '"'
            buildConfigField 'String', 'DEVICE_BACKEND_BASE_URL',
                    '"' + deviceBackendUrl.replace('"', '\\"') + '"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "ru.dgis.sdk:sdk-map:${dgisSdkVersion}"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
}
