[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gulyay-backend"
version = "0.5.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "openai>=1.95,<3", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls configured external services"]

[tool.setuptools.packages.find]
include = ["gulyay*"]
