plugins { id 'com.android.application' }

def backendUrl = providers.environmentVariable('BACKEND_BASE_URL').orElse('https://example.invalid').get()
if (!backendUrl.startsWith('https://')) {
    throw new GradleException('BACKEND_BASE_URL must be HTTPS')
}
def debugBackendUrl = providers.environmentVariable('DEBUG_BACKEND_BASE_URL').orElse(backendUrl).get()
if (!debugBackendUrl.startsWith('https://') && debugBackendUrl != 'http://10.0.2.2:8000') {
    throw new GradleException('DEBUG_BACKEND_BASE_URL must be HTTPS or http://10.0.2.2:8000 for an emulator')
}
android {
    namespace 'ru.gulyay.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.gulyay.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        buildConfigField 'String', 'BACKEND_BASE_URL', '"' + backendUrl.replace('"', '\\"') + '"'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BACKEND_BASE_URL', '"' + debugBackendUrl.replace('"', '\\"') + '"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
